# Plataforma YbYrá-BR — agrega os CSV do GEE em R e publica web/ no GitHub Pages (v0.2.0)
# Dispara a cada envio ao main (inclusive quando novos CSV entram em dados/brutos/).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env: { MODELO: v1_2 }
jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - name: Pacotes R
        run: Rscript -e 'install.packages(c("data.table","jsonlite","R.utils"))'
      - name: Agregar (R)
        run: Rscript R/agregar.R dados/brutos/$MODELO web/dados/$MODELO $MODELO web/geo/municipios.geojson
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
