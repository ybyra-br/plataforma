# Plataforma YbYrá-BR — agrega os CSV do GEE em R e publica web/ no GitHub Pages (v0.2.2)
# Dispara a cada envio ao main (inclusive quando novos CSV entram em dados/brutos/).
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
env: { MODELO: v1_2 }
jobs:
  montar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: R (pacotes do Ubuntu)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends r-base-core r-cran-data.table r-cran-jsonlite r-cran-r.utils
      - name: Agregar (R)
        run: Rscript R/agregar.R dados/brutos/$MODELO web/dados/$MODELO $MODELO web/geo/indice.json
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.dep.outputs.page_url }}" }
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
